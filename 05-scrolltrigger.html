<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP Playground | ScrollTrigger</title>
    <style>
      body {
        font-family: sans-serif;
        color: white;
        margin: 0;
      }
      section {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 3rem;
      }
      .section-1 {
        background-color: #1d1d1d;
      }
      .section-2 {
        background-color: #3a86ff;
      }
      .section-3 {
        background-color: #c73a5d;
      }
      .box {
        width: 150px;
        height: 150px;
        background-color: #ffbe0b;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <section class="section-1"><h1>Scroll Down</h1></section>

    <section class="section-2">
      <div class="box"></div>
    </section>

    <section class="section-3"><h1>The End</h1></section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <script></script>
  </body>
</html>
