<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP Playground | SVG Animation</title>
    <style>
      body {
        background-color: #1d1d1d;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      /* Style the SVG elements */
      .checkmark-svg {
        width: 200px;
        height: 200px;
      }
      .checkmark-circle {
        stroke: #3a86ff;
        stroke-width: 5;
        fill: none;
      }
      .checkmark-path {
        stroke: #4ade80;
        stroke-width: 8;
        stroke-linecap: round;
        fill: none;
      }
    </style>
  </head>
  <body>
    <svg
      class="checkmark-svg"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 100 100"
    >
      <path
        class="checkmark-circle"
        d="M 50,50 m -45,0 a 45,45 0 1,0 90,0 a 45,45 0 1,0 -90,0"
      />

      <path class="checkmark-path" d="M 25 50 L 45 70 L 75 30" />
    </svg>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script></script>
  </body>
</html>
