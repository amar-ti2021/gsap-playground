<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP Project | Preloader</title>
    <style>
      body {
        font-family: sans-serif;
        background-color: #1d1d1d;
        color: white;
        margin: 0;
      }

      /* 1. Preloader Styling */
      #preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #1d1d1d;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }
      .loader-svg {
        width: 100px;
        height: 100px;
      }
      .loader-circle {
        stroke: #3a86ff;
        stroke-width: 4;
        stroke-linecap: round;
        fill: none;
      }

      /* 2. Main Content Styling (initially hidden) */
      #main-content {
        padding: 2rem 4rem;
        opacity: 0;
        visibility: hidden;
      }
      #main-content img {
        max-width: 100%;
        height: auto;
        border-radius: 10px;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <div id="preloader">
      <svg
        class="loader-svg"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 100 100"
      >
        <path
          class="loader-circle"
          d="M 50,50 m -45,0 a 45,45 0 1,0 90,0 a 45,45 0 1,0 -90,0"
        />
      </svg>
    </div>

    <main id="main-content">
      <h1>Welcome to the Page!</h1>
      <p>This content was revealed after the preloader finished.</p>
      <p>
        The preloader waits for all assets, including this (potentially large)
        image, to load completely.
      </p>
      <img src="https://picsum.photos/600/300" alt="Placeholder image" />
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script></script>
  </body>
</html>
