<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP Project | Card Flip (2D)</title>
    <style>
      body {
        font-family: sans-serif;
        background-color: #1d1d1d;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        color: white;
      }
      .card-container {
        display: flex;
        gap: 2rem;
        perspective: 1000px;
      }
      .card {
        width: 220px;
        height: 300px;
        position: relative;
        cursor: pointer;
      }
      .card-face {
        position: absolute;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        border-radius: 15px;
        padding: 20px;
        box-sizing: border-box;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }
      .front {
        background-color: #3a86ff; /* Blue */
      }
      .back {
        background-color: #4ade80; /* Green */
        transform: scaleX(0);
      }
    </style>
  </head>
  <body>
    <div class="card-container">
      <div class="card">
        <div class="card-face front">
          <h2>Front 1</h2>
          <p>Hover over me!</p>
        </div>
        <div class="card-face back">
          <h3>Back 1</h3>
          <p>You found me!</p>
        </div>
      </div>
      <div class="card">
        <div class="card-face front">
          <h2>Front 2</h2>
          <p>Hover over me!</p>
        </div>
        <div class="card-face back">
          <h3>Back 2</h3>
          <p>Surprise!</p>
        </div>
      </div>
      <div class="card">
        <div class="card-face front">
          <h2>Front 3</h2>
          <p>Hover over me!</p>
        </div>
        <div class="card-face back">
          <h3>Back 3</h3>
          <p>Voilà!</p>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script></script>
  </body>
</html>
