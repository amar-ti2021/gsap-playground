<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP Project | Floating Card</title>
    <style>
      body {
        font-family: sans-serif;
        background: #1d1d1d;
        background: radial-gradient(
          circle,
          rgba(43, 43, 43, 1) 0%,
          rgba(29, 29, 29, 1) 100%
        );
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
      }

      .card {
        width: 300px;
        padding: 30px;
        background-color: #2a2a2a;
        border-radius: 20px;
        border: 1px solid #444;
        color: white;

        box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2),
          0px 20px 40px rgba(0, 0, 0, 0.4);
      }

      .card h2 {
        margin-top: 0;
        color: #4ade80;
        font-size: 2rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Floating Card</h2>
      <p>
        This card uses multiple, out-of-sync GSAP tweens to create a smooth and
        natural floating animation.
      </p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
      const card = document.querySelector(".card");

      gsap.to(card, {
        y: -30,
        duration: 3,
        repeat: -1,
        yoyo: true,
        ease: "power1.inOut",
      });

      gsap.to(card, {
        x: 30,
        duration: 5,
        repeat: -1,
        yoyo: true,
        ease: "power1.inOut",
      });

      gsap.to(card, {
        rotation: 2,
        duration: 8,
        repeat: -1,
        yoyo: true,
        ease: "power1.inOut",
      });
    </script>
  </body>
</html>
