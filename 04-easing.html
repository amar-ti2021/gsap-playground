<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP Playground | Easing</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>GSAP Easing</h1>
    <div class="container">
      <div class="animation-item">
        <div class="box" id="box1"></div>
        <p class="description" id="desc1">Box 1</p>
      </div>
      <div class="animation-item">
        <div class="box" id="box2"></div>
        <p class="description" id="desc2">Box 2</p>
      </div>
      <div class="animation-item">
        <div class="box" id="box3"></div>
        <p class="description" id="desc3">Box 3</p>
      </div>
      <div class="animation-item">
        <div class="box" id="box4"></div>
        <p class="description" id="desc4">Box 4</p>
      </div>
      <div class="animation-item">
        <div class="box" id="box5"></div>
        <p class="description" id="desc5">Box 5</p>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
      const distance = 600;

      gsap.to("#box1", {
        x: distance,
        duration: 2,
        ease: "none",
      });
      document.getElementById(
        "desc1"
      ).innerHTML = `<code>ease: "none"</code><br>A constant, linear speed. Feels unnatural.`;

      gsap.to("#box2", {
        x: distance,
        duration: 2,
        ease: "power2.out",
      });
      document.getElementById(
        "desc2"
      ).innerHTML = `<code>ease: "power2.out"</code><br>Starts fast, then decelerates. A very common and smooth ease.`;

      gsap.to("#box3", {
        x: distance,
        duration: 2,
        ease: "power4.inOut",
      });
      document.getElementById(
        "desc3"
      ).innerHTML = `<code>ease: "power4.inOut"</code><br>Starts slow, speeds up in the middle, ends slow.`;

      gsap.to("#box4", {
        x: distance,
        duration: 2,
        ease: "back.out(1.7)",
      });
      document.getElementById(
        "desc4"
      ).innerHTML = `<code>ease: "back.out(1.7)"</code><br>Overshoots the destination then settles back.`;

      gsap.to("#box5", {
        x: distance,
        duration: 2,
        ease: "bounce.out",
      });
      document.getElementById(
        "desc5"
      ).innerHTML = `<code>ease: "bounce.out"</code><br>Bounces at the end like a ball.`;
    </script>
  </body>
</html>
