<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP Project | Infinite Marquee</title>
    <style>
      body {
        font-family: sans-serif;
        background-color: #1d1d1d;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }

      .marquee-wrapper {
        width: 100%;
        max-width: 1000px;
        overflow: hidden;
        border: 2px solid #333;
        padding: 20px 0;
      }

      .marquee-content {
        display: flex;
        gap: 1.5rem;
      }

      .marquee-card {
        flex-shrink: 0;
        width: 250px;
        padding: 20px;
        background-color: #2a2a2a;
        border-radius: 10px;
        border: 1px solid #444;
        text-align: center;
      }

      .marquee-card h3 {
        margin-top: 0;
        color: #3a86ff;
      }
    </style>
  </head>
  <body>
    <div class="marquee-wrapper">
      <div class="marquee-content">
        <div class="marquee-card">
          <h3>HTML5</h3>
          <p>The structure of the web.</p>
        </div>
        <div class="marquee-card">
          <h3>CSS3</h3>
          <p>Styling and design.</p>
        </div>
        <div class="marquee-card">
          <h3>JavaScript</h3>
          <p>Interactivity and logic.</p>
        </div>
        <div class="marquee-card">
          <h3>GSAP</h3>
          <p>Powerful web animation.</p>
        </div>
        <div class="marquee-card">
          <h3>React</h3>
          <p>Component-based UI.</p>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script></script>
  </body>
</html>
