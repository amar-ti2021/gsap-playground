<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP Playground | Timelines</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>GSAP Timelines</h1>
    <div class="container">
      <div class="animation-item">
        <div class="box" id="box1"></div>
        <p class="description">Box 1</p>
      </div>

      <div class="animation-item">
        <div class="box" id="box2"></div>
        <p class="description">Box 2</p>
      </div>

      <div class="animation-item">
        <div class="box" id="box3"></div>
        <p class="description">Box 3</p>
      </div>
    </div>
  </body>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script>
    const tl = gsap.timeline({
      defaults: {
        duration: 1,
      },
    });

    tl.to("#box1", { x: 400 });
    tl.from("#box2", {
      x: -200,
      opacity: 0,
      scale: 0.5,
      duration: 1,
    });
    tl.to("#box3", { rotation: 360 });
  </script>
</html>
