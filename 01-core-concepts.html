<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP Playground | Core Concepts</title>
    <style>
      body {
        font-family: sans-serif;
        background-color: #1d1d1d;
        color: white;
        padding: 2rem;
      }
      .container {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }
      .box {
        width: 80px;
        height: 80px;
        border-radius: 10px;
      }
      #box1 {
        background-color: #c73a5d;
      }
      #box2 {
        background-color: #3a86ff;
      }
      #box3 {
        background-color: #ffbe0b;
      }
    </style>
  </head>

  <body>
    <h1>GSAP Core Concepts</h1>
    <div class="container">
      <div class="box" id="box1"></div>
      <div class="box" id="box2"></div>
      <div class="box" id="box3"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <script>
      gsap.to("#box1", {
        x: 400,
        scale: 1.5,
        rotation: 360,
        duration: 1.5,
      });

      gsap.from("#box2", {
        opacity: 0,
        y: 100,
        duration: 1,
      });

      gsap.fromTo(
        "#box3",
        {
          x: -200,
          opacity: 0,
          scale: 0.5,
        },
        {
          x: 200,
          opacity: 1,
          scale: 1,
          rotation: 720,
          duration: 2,
        }
      );
    </script>
  </body>
</html>
